<!-- ============================================================
  RAJSKÁ CLINIC — skript pro stránku CENÍK (jediné ruční vložení)

  KAM: Webflow Designer → Pages → Ceník → ⚙ Settings
       → Custom code → „Before </body> tag" → vložit celý blok → Save.

  CO DĚLÁ:
  1. Rozřadí 125 položek ze skrytých zásobníků pod 24 kategorií.
  2. Kategorie = akordeon: sbalené, rozbalí se kliknutím na název (+/−).
  3. Okamžité fulltextové vyhledávání (bez načítání stránky):
     – bez diakritiky („zilky" najde „žilky")
     – hledá v názvech kategorií, klíčových slovech z CMS
       (synonyma jako „botox"), názvech i skupinách položek
     – nalezené kategorie automaticky rozbalí, nenalezené skryje
     – prázdný výsledek zobrazí hlášku #cenikPrazdne
  4. Čipy „Nejčastěji hledáte" vyplní hledání jedním klikem.
  5. Skryje akční boxy bez textu a přesune poznámku kategorie
     pod položky.
============================================================ -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var norm = function (s) {
    return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  };

  /* 1) rozřazení položek pod kategorie (Finsweet „CMS nest" vzor) */
  document.querySelectorAll('#cenik-zasobnik-1 .cenik-polozka, #cenik-zasobnik-2 .cenik-polozka').forEach(function (r) {
    var m = r.querySelector('.je-skryte');
    var kat = m ? m.textContent.trim() : '';
    var cil = document.getElementById(kat);
    if (cil) { cil.appendChild(r); }
  });

  var kategorie = Array.prototype.slice.call(document.querySelectorAll('.cenik-kategorie'));

  kategorie.forEach(function (kat) {
    /* poznámku kategorie přesunout až pod položky */
    var pozn = kat.querySelector(':scope > .cenik-skupina');
    if (pozn) {
      if (pozn.textContent.trim()) { kat.appendChild(pozn); } else { pozn.style.display = 'none'; }
    }
    /* 2) akordeon */
    var h = kat.querySelector('h3');
    if (h) {
      h.addEventListener('click', function () { kat.classList.toggle('je-rozbalena'); });
    }
  });

  /* 5) skrýt prázdné akční boxy */
  document.querySelectorAll('[data-akce-box]').forEach(function (b) {
    var t = (b.firstElementChild && b.firstElementChild.textContent.trim()) || '';
    if (!t) { b.style.display = 'none'; }
  });

  /* 3) fulltextové vyhledávání */
  var input = document.getElementById('cenikHledani');
  var chipy = document.getElementById('cenikChipy');
  var prazdne = document.getElementById('cenikPrazdne');
  if (!input) return;

  function filtruj() {
    var q = norm(input.value.trim());
    var nalezeno = 0;

    kategorie.forEach(function (kat) {
      var nazev = norm((kat.querySelector('h3') || {}).textContent);
      var slovaEl = kat.querySelector(':scope > .je-skryte');
      var slova = norm(slovaEl ? slovaEl.textContent : '');
      var katShoda = !q || nazev.indexOf(q) !== -1 || slova.indexOf(q) !== -1;

      var polozky = kat.querySelectorAll('.cenik-polozka');
      var viditelnych = 0;
      polozky.forEach(function (p) {
        var shoda = katShoda || norm(p.textContent).indexOf(q) !== -1;
        p.style.display = shoda ? '' : 'none';
        if (shoda) viditelnych++;
      });

      var zobraz = katShoda || viditelnych > 0;
      kat.style.display = zobraz ? '' : 'none';
      if (zobraz) nalezeno++;

      /* při hledání rozbalit shody, po smazání dotazu vše sbalit */
      if (q && zobraz) { kat.classList.add('je-rozbalena'); }
      else if (!q) { kat.classList.remove('je-rozbalena'); }
    });

    if (prazdne) { prazdne.classList.toggle('je-skryte', !(q && nalezeno === 0)); }
  }

  input.addEventListener('input', filtruj);
  if (chipy) {
    chipy.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (btn) { input.value = btn.textContent.trim(); filtruj(); input.focus(); }
    });
  }
});
</script>
